name: Validate and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ha-version: ["2026.11.2", "2026.11.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install audio and camera libraries
        timeout-minutes: 10
        run: |
          for ubuntu_source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$ubuntu_source" ]; then
              sudo sed -E -i 's|https?://[a-zA-Z0-9.-]+\.ec2\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$ubuntu_source"
            fi
          done
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y ffmpeg libturbojpeg
      - run: python -m pip install -r requirements_test.txt
      - if: matrix.ha-version != '2026.11.2'
        run: python -m pip install "homeassistant==${{ matrix.ha-version }}" "pytest-homeassistant==${{ matrix.ha-version }}"
      - run: python -m pip check
      - run: ruff check custom_components tests scripts
      - run: ruff format --check custom_components tests scripts
      - run: mypy custom_components/deepseek_ai
      - run: python -m pytest -q --junitxml=test-results.xml
      - uses: actions/checkout@v4
        with:
          repository: home-assistant/core
          ref: ${{ matrix.ha-version }}
          path: _ha-core
          sparse-checkout: |
            script/hassfest
            packages/hassfest
      - run: python scripts/check_metadata.py --ha-source _ha-core --ha-version "${{ matrix.ha-version }}"
      - run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: deepseek-ai-installers-${{ matrix.ha-version }}
          path: |
            dist/*.zip
            dist/SHA256SUMS
            test-results.xml
